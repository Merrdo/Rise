<!-- window.storage polyfill: localStorage tabanlı basit kalıcı depolama -->
<script>
(function () {
  function storageKey(key, shared) {
    return (shared ? "gp-shared:" : "gp-local:") + key;
  }
  window.storage = {
    async get(key, shared) {
      try {
        const raw = localStorage.getItem(storageKey(key, !!shared));
        if (raw === null) return null;
        return { key, value: raw, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async set(key, value, shared) {
      try {
        localStorage.setItem(storageKey(key, !!shared), value);
        return { key, value, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async delete(key, shared) {
      try {
        localStorage.removeItem(storageKey(key, !!shared));
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
    async list(prefix, shared) {
      try {
        const p = storageKey(prefix || "", !!shared);
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice((shared ? "gp-shared:" : "gp-local:").length));
        }
        return { keys, prefix, shared: !!shared };
      } catch (e) {
        return null;
      }
    },
  };
})();
</script>

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function ringDots(count, radius, center) {
  return Array.from({ length: count }).map((_, i) => {
    const a = (i / count) * Math.PI * 2;
    return { x: center + radius * Math.cos(a), y: center + radius * Math.sin(a) };
  });
}
function formatDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds || 0));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
}

  const BASE_W = 440, BASE_H = 900;
  const [scale, setScale] = useState(1);
  useEffect(() => {
    function computeScale() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const s = Math.min(vw / BASE_W, vh / BASE_H, 1.9);
      setScale(Math.max(s, 1));
    }
    computeScale();
    window.addEventListener("resize", computeScale);
    window.addEventListener("orientationchange", computeScale);
    return () => {
      window.removeEventListener("resize", computeScale);
      window.removeEventListener("orientationchange", computeScale);

  // splash: yalnızca "Başla" butonuna basılınca kapanır, otomatik geçiş yok  // yakınlaştırmayı (pinch-zoom / çift dokunma zoom / ctrl+wheel zoom) engelle
  useEffect(() => {
    function preventGesture(e) { e.preventDefault(); }
    function preventMultiTouch(e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }
    let lastTouchEnd = 0;
    function preventDoubleTapZoom(e) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }
    function preventWheelZoom(e) { if (e.ctrlKey) e.preventDefault(); }
    document.addEventListener("gesturestart", preventGesture, { passive: false });
    document.addEventListener("gesturechange", preventGesture, { passive: false });
    document.addEventListener("touchmove", preventMultiTouch, { passive: false });
    document.addEventListener("touchend", preventDoubleTapZoom, { passive: false });
    document.addEventListener("wheel", preventWheelZoom, { passive: false });
    return () => {
      document.removeEventListener("gesturestart", preventGesture);
      document.removeEventListener("gesturechange", preventGesture);
      document.removeEventListener("touchmove", preventMultiTouch);
      document.removeEventListener("touchend", preventDoubleTapZoom);
      document.removeEventListener("wheel", preventWheelZoom);
    };
  }, []);

  // number count-up animation
  useEffect(() => {
    cancelAnimationFrame(rafRef.current);
    const from = dispDone, to = doneCount, dur = 450, start = performance.now();
    function step(now) {
      const p = Math.min(1, (now - start) / dur);
      setDispDone(Math.round(from + (to - from) * p));
      if (p < 1) rafRef.current = requestAnimationFrame(step);
    }
    rafRef.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(rafRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [doneCount, active]);

  // status line fade on change
  const statusKey = totalCount === 0 ? "empty" : remaining === 0 ? "done" : "remaining-" + remaining;
  const prevStatusKey = useRef(statusKey);
  useEffect(() => {
    if (prevStatusKey.current !== statusKey) {
      setStatusFade(true);
      const t = setTimeout(() => { setStatusFade(false); prevStatusKey.current = statusKey; }, 160);
      return () => clearTimeout(t);
    }
  }, [statusKey]);

  // sliding nav highlight
  const [hiStyle, setHiStyle] = useState({ width: 0, x: 0 });
  useLayoutEffect(() => {
    const btn = navBtnRefs.current[active];
    const bar = navBarRef.current;
    if (btn && bar) {
      const br = btn.getBoundingClientRect(), pr = bar.getBoundingClientRect();
      setHiStyle({ width: br.width, x: br.left - pr.left - 10 });
    }
  }, [active, ready]);
  useEffect(() => {
    function onResize() {
      const btn = navBtnRefs.current[active];
      const bar = navBarRef.current;
      if (btn && bar) {
        const br = btn.getBoundingClientRect(), pr = bar.getBoundingClientRect();
        setHiStyle({ width: br.width, x: br.left - pr.left - 10 });
      }
    }
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [active]);

  async function persistLists(next) {
    setLists(next);
    try { await window.storage.set("planner-lists-v2", JSON.stringify(next), false); } catch (e) {}
  }
  async function persistCompletions(next) {
    setCompletions(next);
    try { await window.storage.set("planner-completions-v2", JSON.stringify(next), false); } catch (e) {}
  }
  async function persistSporSessions(next) {
    setSporSessions(next);
    try { await window.storage.set("planner-spor-sessions-v1", JSON.stringify(next), false); } catch (e) {}
  }
  function toggleItem(id) {
    if (editMode) return;
    const dm = { ...dayMap, [id]: !dayMap[id] };
    persistCompletions({ ...completions, [dateKey]: dm });
  }
  function addItem() {
    const text = draft.trim();
    if (!text) return;
    const id = active[0] + Date.now();
    persistLists({ ...lists, [active]: [...items, { id, text }] });
    setDraft("");
  }
  function removeItem(id) {
    persistLists({ ...lists, [active]: items.filter((it) => it.id !== id) });
    const dm = { ...dayMap }; delete dm[id];
    persistCompletions({ ...completions, [dateKey]: dm });
  }
  function resetToday() {
    persistCompletions({ ...completions, [dateKey]: {} });
  }
  function openLists(focusInput) {
    setListsOpen(true);
    if (focusInput) setTimeout(() => inputRef.current?.focus(), 380);
  }

  // ---- Spor: seans & hareket yönetimi ----
  function addSession() {
    const name = newSessionName.trim();
    if (!name) return;
    const session = { id: "ses" + Date.now(), name, exercises: [] };
    persistSporSessions([...sporSessions, session]);
    setNewSessionName("");
  }
  function removeSession(id) {
    persistSporSessions(sporSessions.filter((s) => s.id !== id));
    if (player && player.sessionId === id) setPlayer(null);
  }
  function openExerciseForm(sessionId) {
    setExDraftFor(sessionId);
    setExText(""); setExMode("time"); setExSeconds(30); setExReps(""); setExRest(0);
    setExMediaUrl(null); setExMediaType(null);
  }
  function handleMediaFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const isVideo = file.type.startsWith("video/");
    const reader = new FileReader();
    reader.onload = () => {
      setExMediaUrl(reader.result);
      setExMediaType(isVideo ? "video" : "image");
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }
  function addExercise(sessionId) {
    const text = exText.trim();
    if (!text) return;
    const ex = {
      id: "ex" + Date.now(),
      text,
      mode: exMode,
      seconds: exMode === "time" ? Math.max(1, Number(exSeconds) || 30) : undefined,
      repsLabel: exMode === "reps" ? (exReps.trim() || "1 set") : undefined,
      restSeconds: Math.max(0, Number(exRest) || 0),
      mediaUrl: exMediaUrl || undefined,
      mediaType: exMediaUrl ? exMediaType : undefined,
    };
    persistSporSessions(sporSessions.map((s) => (s.id === sessionId ? { ...s, exercises: [...s.exercises, ex] } : s)));
    setExDraftFor(null);
    setExMediaUrl(null); setExMediaType(null);
  }
  function removeExercise(sessionId, exId) {
    persistSporSessions(sporSessions.map((s) => (s.id === sessionId ? { ...s, exercises: s.exercises.filter((e) => e.id !== exId) } : s)));
    const dm = { ...dayMap }; delete dm[exId];
    persistCompletions({ ...completions, [dateKey]: dm });
  }

  // ---- Spor: tam ekran oynatıcı ----
  function startSession(sessionId) {
    const session = sporSessions.find((s) => s.id === sessionId);
    if (!session || session.exercises.length === 0) return;
    const ex = session.exercises[0];
    setPlayer(
      ex.mode === "time"
        ? { sessionId, index: 0, phase: "exercise", secondsLeft: ex.seconds, running: true }
        : { sessionId, index: 0, phase: "exercise", secondsLeft: null, running: false }
    );
  }
  function advanceExercise() {
    setPlayer((p) => {
      if (!p) return p;
      const session = sporSessions.find((s) => s.id === p.sessionId);
      const nextIndex = p.index + 1;
      if (!session || nextIndex >= session.exercises.length) {
        return { ...p, phase: "done", secondsLeft: null, running: false };
      }
      const nextEx = session.exercises[nextIndex];
      return nextEx.mode === "time"
        ? { sessionId: p.sessionId, index: nextIndex, phase: "exercise", secondsLeft: nextEx.seconds, running: true }
        : { sessionId: p.sessionId, index: nextIndex, phase: "exercise", secondsLeft: null, running: false };
    });
  }
  function completeCurrentExercise() {
    if (!player) return;
    const session = sporSessions.find((s) => s.id === player.sessionId);
    const ex = session?.exercises[player.index];
    if (ex) persistCompletions({ ...completions, [dateKey]: { ...dayMap, [ex.id]: true } });
    if (ex && ex.restSeconds > 0) {
      setPlayer((p) => (p ? { ...p, phase: "rest", secondsLeft: ex.restSeconds, running: true } : p));
    } else {
      advanceExercise();
    }
  }
  function skipCurrent() {
    if (!player) return;
    advanceExercise();
  }
  function togglePause() {
    setPlayer((p) => (p ? { ...p, running: !p.running } : p));
  }
  function closePlayer() {
    setPlayer(null);
  }

  // oynatıcı panelinin akıcı açılış/kapanış geçişi: kapanırken içerik hemen sıfırlanmaz,
  // "closing" animasyonu bitene kadar ekranda tutulur.
  useEffect(() => {
    if (player) {
      clearTimeout(playerCloseTimeoutRef.current);
      setPlayerClosing(false);
      setDisplayPlayer(player);
    } else if (displayPlayer) {
      setPlayerClosing(true);
      playerCloseTimeoutRef.current = setTimeout(() => {
        setDisplayPlayer(null);
        setPlayerClosing(false);
      }, 320);
    }
    return () => clearTimeout(playerCloseTimeoutRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [player]);

  // saniye sayacı: her saniye tik atar
  useEffect(() => {
    if (!player || !player.running || player.secondsLeft == null) return;
    const t = setTimeout(() => {
      setPlayer((p) => (p && p.secondsLeft != null ? { ...p, secondsLeft: p.secondsLeft - 1 } : p));
    }, 1000);
    return () => clearTimeout(t);
  }, [player]);

  // süre bittiğinde faz geçişi
  useEffect(() => {
    if (!player || player.secondsLeft !== 0) return;
    if (player.phase === "exercise") completeCurrentExercise();
    else if (player.phase === "rest") advanceExercise();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [player?.secondsLeft, player?.phase, player?.sessionId, player?.index]);

  const R = 118, CX = 160, CY = 150;
  const arcLen = Math.PI * R;
  const dashOffset = arcLen - Math.min(pct, 1) * arcLen;
  const ang = Math.PI - Math.min(pct, 1) * Math.PI;
  const ex = CX + R * Math.cos(ang), ey = CY - R * Math.sin(ang);
  const statusText = totalCount === 0 ? "Henüz madde yok" : remaining === 0 ? "Hedefe ulaşıldı" : `${remaining} madde kaldı`;

  return (
    <div className="gp-root" style={{ background: BG, fontFamily: "'Inter',-apple-system,sans-serif", color: INK, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <style>{CSS}</style>
      <div
        className="gp-frame"
        style={{
          width: BASE_W,
          height: BASE_H,
          maxHeight: "100dvh",
          position: "relative",
          overflow: "hidden",
          transform: `scale(${scale})`,
          transformOrigin: "center center",
        }}
      >

      {/* SPLASH */}
      <div id="gp-splash" className={splashHide ? "hide" : ""}>
        <div className="aurora-blob b1" /><div className="aurora-blob b2" /><div className="aurora-blob b3" />
        <div style={{ position: "relative", zIndex: 2, animation: "riseIn 1s ease .1s both" }}>
          <div style={{ fontFamily: "'Fraunces',serif", fontWeight: 300, fontSize: 44, margin: "0 0 14px", lineHeight: 1.1 }}>Bugüne hoş geldin</div>
          <div style={{ fontSize: 15, color: INK_DIM, maxWidth: 280, margin: "0 auto 30px", lineHeight: 1.5 }}>
            Spor, beslenme, ilaç ve genel görevlerini tek yerden takip et. Her gün sıfırdan başlar.
          </div>
          <button className="gp-btn" onClick={() => setSplashHide(true)} style={{ padding: "13px 30px", borderRadius: 26, border: "1px solid rgba(244,242,237,0.35)", background: "rgba(244,242,237,0.08)", color: INK, fontSize: 14.5, fontWeight: 600, cursor: "pointer", backdropFilter: "blur(8px)" }}>
            Başla
          </button>
        </div>
      </div>

      <div className="gp-heroscroll" style={{ width: "100%", maxWidth: 440, position: "relative", height: "100%", overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
        {/* HERO */}
        <div style={{ position: "relative", padding: "calc(20px + env(safe-area-inset-top)) 20px 28px", overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, zIndex: 0 }}>
            <div style={{ position: "absolute", width: 280, height: 280, borderRadius: "50%", filter: "blur(70px)", opacity: 0.45, mixBlendMode: "screen", background: "#13343d", top: -100, left: -40, animation: "drift1 20s ease-in-out infinite" }} />
            <div style={{ position: "absolute", width: 260, height: 260, borderRadius: "50%", filter: "blur(70px)", opacity: 0.45, mixBlendMode: "screen", background: "#1b3a2c", bottom: -60, right: -40, animation: "drift2 22s ease-in-out infinite" }} />
            <div style={{ position: "absolute", inset: 0, background: `radial-gradient(circle at 50% 30%, ${cat.accent} 0%, transparent 60%)`, opacity: 0.16, transition: "background .3s" }} />
            <div style={{ position: "absolute", inset: 0, background: `linear-gradient(to bottom, transparent 0%, rgba(10,13,17,0.7) 70%, ${BG} 100%)` }} />
          </div>

          <div style={{ position: "relative", zIndex: 1, paddingBottom: 108 }}>
            {/* nav */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <button className="gp-icon-btn" onClick={() => setNavMenuOpen(true)} aria-label="Menü" style={{ background: "transparent", border: "none", color: INK, cursor: "pointer", padding: 4 }}>
                <Menu size={22} strokeWidth={1.8} />
              </button>
              <div style={{ fontSize: 12.5, fontWeight: 700, letterSpacing: 3 }}>PLANLA</div>
              <button
                className="gp-icon-btn"
                onClick={() => setEditMode((v) => !v)}
                aria-label="Düzenle"
                style={{ width: 34, height: 34, borderRadius: 17, border: "1px solid rgba(244,242,237,0.3)", background: editMode ? INK : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
              >
                <Pencil size={15} strokeWidth={1.8} color={editMode ? BG : INK} />
              </button>
            </div>

            {/* badges */}
            <div style={{ display: "flex", justifyContent: "space-between", padding: "26px 2px 4px" }}>
              {CATS.map((c) => {
                const Icon = c.Icon;
                const n = catItems(c.key).length;
                const d = catItems(c.key).filter((it) => dayMap[it.id]).length;
                const isActive = c.key === active;
                return (
                  <button key={c.key} className="gp-badge" onClick={() => setActive(c.key)} style={{ border: "none", background: "transparent", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 8, width: 74 }}>
                    <div className="gp-circ" style={{ width: 58, height: 58, borderRadius: 29, background: "rgba(244,242,237,0.08)", backdropFilter: "blur(6px)", border: isActive ? `1.5px solid ${c.accent}` : "1px solid rgba(244,242,237,0.16)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 1, transition: "border-color .25s, transform .15s" }}>
                      <Icon size={16} strokeWidth={1.7} color={isActive ? c.accent : INK} />
                      <span style={{ fontSize: 12, fontWeight: 600, color: isActive ? c.accent : INK, fontFamily: "'JetBrains Mono',monospace", fontFeatureSettings: "'zero' 0" }}>{d}/{n}</span>
                    </div>
                    <span style={{ fontSize: 10.5, fontWeight: 500, color: isActive ? INK : INK_DIM }}>{c.label}</span>
                  </button>
                );
              })}
            </div>

            {/* breathing rings */}
            <div style={{ position: "relative", width: 220, height: 220, margin: "6px auto -190px", pointerEvents: "none" }}>
              <div style={{ position: "absolute", inset: 0, animation: "spin 26s linear infinite, breathe 4.5s ease-in-out infinite" }}>
                {outerDots.map((p, i) => (
                  <div key={i} style={{ position: "absolute", width: 4, height: 4, borderRadius: "50%", background: cat.accent, opacity: 0.35, left: p.x, top: p.y, transition: "background .3s" }} />
                ))}
              </div>
              <div style={{ position: "absolute", inset: 0, animation: "spin2 18s linear infinite reverse, breathe 4.5s ease-in-out infinite .3s" }}>
                {innerDots.map((p, i) => (
                  <div key={i} style={{ position: "absolute", width: 4, height: 4, borderRadius: "50%", background: cat.accent, opacity: 0.35, left: p.x, top: p.y, transition: "background .3s" }} />
                ))}
              </div>
            </div>

            {/* arc gauge */}
            <div style={{ position: "relative", marginTop: 18 }}>
              <svg viewBox="0 0 320 168" style={{ display: "block", width: "100%", overflow: "visible" }}>
                <path d={`M 42 ${CY} A ${R} ${R} 0 0 1 278 ${CY}`} fill="none" stroke="rgba(244,242,237,0.2)" strokeWidth="10" strokeLinecap="round" />
                <path
                  d={`M 42 ${CY} A ${R} ${R} 0 0 1 278 ${CY}`}
                  fill="none" stroke={cat.accent} strokeWidth="10" strokeLinecap="round"
                  strokeDasharray={arcLen} strokeDashoffset={dashOffset}
                  style={{ transition: "stroke-dashoffset .7s cubic-bezier(.4,0,.2,1), stroke .3s" }}
                />
                <circle cx="60" cy="112" r="2" fill="rgba(244,242,237,0.4)" />
                <circle cx="160" cy="34" r="2" fill="rgba(244,242,237,0.4)" />
                <circle cx="260" cy="112" r="2" fill="rgba(244,242,237,0.4)" />
                <circle cx={ex} cy={ey} r="6" fill={cat.accent} style={{ animation: "pulseDot 2.2s ease-in-out infinite", transition: "fill .3s" }} />
                <text x="30" y={CY + 22} fill={INK_FAINT} fontSize="11" fontFamily="'Inter',sans-serif" fontWeight="600" style={{ fontVariantNumeric: "tabular-nums" }}>0</text>
                <text x="260" y={CY + 22} fill={INK_FAINT} fontSize="11" fontFamily="'Inter',sans-serif" fontWeight="600" style={{ fontVariantNumeric: "tabular-nums" }}>{totalCount}</text>
              </svg>
              <div style={{ position: "absolute", left: "50%", top: 64, transform: "translateX(-50%)" }}>
                <cat.Icon size={22} strokeWidth={1.6} color={cat.accent} />
              </div>
            </div>

            {/* stat text */}
            <div style={{ textAlign: "center" }}>
              <div style={{ fontSize: 11.5, fontWeight: 600, letterSpacing: 2, color: INK_DIM, textTransform: "uppercase" }}>{cat.label} İlerlemesi</div>
              <div style={{ fontFamily: "'Inter',sans-serif", fontWeight: 300, fontSize: 58, lineHeight: 1.05, margin: "6px 0 2px", fontVariantNumeric: "tabular-nums" }}>{dispDone}/{totalCount}</div>
              <div style={{ fontFamily: "'Fraunces',serif", fontStyle: "italic", fontWeight: 400, fontSize: 27, marginBottom: 8, minHeight: 34, opacity: statusFade ? 0 : 1, transform: statusFade ? "translateY(4px)" : "translateY(0)", transition: "opacity .3s, transform .3s" }}>
                {statusText}
              </div>
              <div style={{ fontSize: 13.5, color: INK_DIM, marginBottom: 18 }}>
                {remaining === 0 && totalCount > 0 ? `Bugünkü ${cat.label.toLowerCase()} listeni tamamladın` : `Bugünkü ${cat.label.toLowerCase()} listeni tamamla`}
              </div>
              <button id="gp-cta" onClick={() => openLists(false)} style={{ padding: "12px 26px", borderRadius: 24, border: "1px solid rgba(244,242,237,0.25)", background: "rgba(244,242,237,0.14)", backdropFilter: "blur(6px)", color: INK, fontSize: 14.5, fontWeight: 600, cursor: "pointer", transition: "transform .12s" }}>
                Listeyi gör
              </button>
            </div>

            {/* insight card */}
            <button id="gp-insight" onClick={() => setInsightOpen(true)} style={{ width: "100%", marginTop: 24, display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", borderRadius: 16, border: "1px solid rgba(244,242,237,0.14)", background: "rgba(20,24,28,0.55)", backdropFilter: "blur(10px)", cursor: "pointer" }}>
              <div style={{ width: 40, height: 40, borderRadius: 20, background: "rgba(244,242,237,0.1)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <HeartPulse size={18} strokeWidth={1.7} color={cat.accent} />
              </div>
              <div style={{ flex: 1, textAlign: "left" }}>
                <div style={{ fontSize: 14.5, fontWeight: 600 }}>Genel Durum</div>
                <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: 1, color: cat.accent, textTransform: "uppercase", transition: "color .3s" }}><span style={{ fontFamily: "'JetBrains Mono',monospace", fontFeatureSettings: "'zero' 0" }}>{doneAll}/{totalAll}</span> TAMAMLANDI</div>
              </div>
              <ChevronRight size={18} color={INK_DIM} />
            </button>
          </div>
        </div>

      </div>

      {/* GENEL DURUM — pop-up modal */}
      {insightOpen && (
        <div
          onClick={() => setInsightOpen(false)}
          style={{ position: "absolute", inset: 0, zIndex: 80, maxWidth: 440, margin: "0 auto", background: "rgba(6,8,10,0.7)", backdropFilter: "blur(4px)", display: "flex", alignItems: "flex-end", justifyContent: "center", animation: "modalFadeIn .25s ease both" }}
        >
          <div
            onClick={(e) => e.stopPropagation()}
            style={{ width: "100%", maxHeight: "80%", overflowY: "auto", background: SURFACE, borderTop: `1px solid ${HAIR}`, borderRadius: "24px 24px 0 0", padding: "14px 22px calc(26px + env(safe-area-inset-bottom))", animation: "modalSlideUp .32s cubic-bezier(.22,1,.36,1) both" }}
          >
            <div style={{ width: 36, height: 4, borderRadius: 2, background: "rgba(244,242,237,0.22)", margin: "0 auto 18px" }} />
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 38, height: 38, borderRadius: 19, background: "rgba(244,242,237,0.1)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <HeartPulse size={17} strokeWidth={1.7} color={cat.accent} />
                </div>
                <div>
                  <div style={{ fontFamily: "'Fraunces',serif", fontWeight: 400, fontSize: 19 }}>Genel Durum</div>
                  <div style={{ fontSize: 11.5, color: INK_DIM }}>Bugünün özeti</div>
                </div>
              </div>
              <button onClick={() => setInsightOpen(false)} aria-label="Kapat" style={{ width: 32, height: 32, borderRadius: 16, border: "1px solid rgba(244,242,237,0.2)", background: "transparent", color: INK, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
                <X size={15} />
              </button>
            </div>

            <div style={{ textAlign: "center", padding: "22px 0 18px" }}>
              <div style={{ fontFamily: "'Inter',sans-serif", fontWeight: 300, fontSize: 46, lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>{doneAll}/{totalAll}</div>
              <div style={{ fontSize: 11.5, fontWeight: 600, letterSpacing: 2, color: INK_DIM, textTransform: "uppercase", marginTop: 6 }}>Tüm Kategoriler Tamamlandı</div>
            </div>

            <div style={{ padding: "4px 0 8px" }}>
              {CATS.map((c) => {
                const Icon = c.Icon;
                const d = catItems(c.key).filter((it) => dayMap[it.id]).length;
                const t = catItems(c.key).length;
                const p = t ? (d / t) * 100 : 0;
                return (
                  <div key={c.key} style={{ display: "flex", alignItems: "center", gap: 12, padding: "11px 0", borderBottom: `1px solid ${HAIR}` }}>
                    <div style={{ width: 32, height: 32, borderRadius: 16, background: `${c.accent}1e`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>

      {/* floating pill nav */}
      <div style={{ position: "absolute", bottom: 20, left: 0, right: 0, display: "flex", justifyContent: "center", padding: "0 20px", zIndex: 20 }}>
        <div ref={navBarRef} style={{ maxWidth: 400, width: "100%", position: "relative", display: "flex", alignItems: "center", gap: 4, background: "rgba(18,22,27,0.82)", backdropFilter: "blur(16px)", border: "1px solid rgba(244,242,237,0.1)", borderRadius: 30, padding: "8px 10px", boxShadow: "0 10px 30px rgba(0,0,0,0.4)" }}>
          <div style={{ position: "absolute", top: 8, bottom: 8, left: 10, width: hiStyle.width, borderRadius: 20, background: "rgba(244,242,237,0.1)", transform: `translateX(${hiStyle.x}px)`, transition: "transform .3s cubic-bezier(.4,0,.2,1), width .3s", zIndex: 0 }} />
          {CATS.map((c) => {
            const Icon = c.Icon;
            const isActive = c.key === active;
            return (
              <button
                key={c.key}
                ref={(el) => (navBtnRefs.current[c.key] = el)}
                className="gp-navbtn"
                onClick={() => { setEditMode(false); setActive(c.key); }}
                style={{ position: "relative", zIndex: 1, flex: 1, border: "none", background: "transparent", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "8px 4px", color: isActive ? c.accent : INK_DIM }}
              >
                <Icon size={18} strokeWidth={1.8} />
                <span style={{ fontSize: 9.5, fontWeight: 600 }}>{c.label}</span>
              </button>
            );
          })}
          <button id="gp-addbtn" onClick={() => setSheetOpen(true)} aria-label="Hızlı işlemler" style={{ width: 40, height: 40, borderRadius: 20, border: "none", flexShrink: 0, background: cat.accent, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", transition: "background .3s", position: "relative", zIndex: 1 }}>
            <Plus size={19} color={BG} strokeWidth={2.5} />
          </button>
        </div>
      </div>

      {/* SPOR — tam ekran hareket/dinlenme oynatıcı */}
      {displayPlayer && (() => {
        const dp = displayPlayer;
        const session = sporSessions.find((s) => s.id === dp.sessionId);
        const ex = session?.exercises[dp.index];
        const nextEx = session?.exercises[dp.index + 1];
        const total = session?.exercises.length || 0;
        const accent = CATMAP.spor.accent;
        const isRunningTimer = dp.phase !== "done" && dp.running && dp.secondsLeft != null;
        return (
          <div className={"gp-player-panel" + (playerClosing ? " closing" : "")} style={{ position: "absolute", inset: 0, zIndex: 60, background: BG, display: "flex", flexDirection: "column", maxWidth: 440, margin: "0 auto" }}>
            <div style={{ position: "absolute", inset: 0, zIndex: 0, background: `radial-gradient(circle at 50% 20%, ${accent} 0%, transparent 55%)`, opacity: dp.phase === "rest" ? 0.1 : 0.18, transition: "opacity .5s ease" }} />
            <div style={{ position: "relative", zIndex: 1, display: "flex", flexDirection: "column", height: "100%", padding: "calc(22px + env(safe-area-inset-top)) 24px 34px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <button onClick={closePlayer} aria-label="Kapat" style={{ width: 34, height: 34, borderRadius: 17, border: "1px solid rgba(244,242,237,0.25)", background: "transparent", color: INK, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", transition: "transform .15s" }}>
                  <X size={16} />
                </button>
                <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 2, color: INK_DIM }}>{session?.name?.toUpperCase()}</div>
                <div style={{ fontSize: 12.5, fontFamily: "'JetBrains Mono',monospace", fontFeatureSettings: "'zero' 0", color: INK_DIM, width: 34, textAlign: "right" }}>
                  {dp.phase === "done" ? `${total}/${total}` : `${dp.index + 1}/${total}`}
                </div>
              </div>

              {/* ilerleme noktaları */}
              <div style={{ display: "flex", gap: 6, marginTop: 18 }}>
                {session?.exercises.map((e, i) => {
                  const isCurrent = i === dp.index && dp.phase !== "done";
                  return (
                    <div
                      key={e.id}
                      className={"gp-progress-dot" + (isCurrent ? " current" : "")}
                      style={{ flex: 1, height: 4, borderRadius: 2, background: i < dp.index || dp.phase === "done" ? accent : isCurrent ? "rgba(244,242,237,0.4)" : "rgba(244,242,237,0.14)" }}
                    />
                  );
                })}
              </div>

              <div key={dp.phase + "-" + dp.index} className="gp-phase-content" style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
                {dp.phase === "done" ? (
                  <>
                    <CheckCircle2 size={56} color={accent} strokeWidth={1.5} style={{ animation: "ppPop .4s cubic-bezier(.34,1.56,.64,1) both" }} />
                    <div style={{ fontFamily: "'Fraunces',serif", fontWeight: 300, fontSize: 34, margin: "18px 0 6px" }}>Seans tamamlandı</div>
                    <div style={{ fontSize: 14, color: INK_DIM, marginBottom: 30 }}>{session?.name} bitti — harika iş.</div>
                    <button onClick={closePlayer} style={{ padding: "13px 32px", borderRadius: 26, border: "none", background: accent, color: BG, fontSize: 14.5, fontWeight: 700, cursor: "pointer", transition: "transform .15s" }}>Kapat</button>
                  </>
                ) : dp.phase === "rest" ? (
                  <>
                    <div style={{ fontSize: 12.5, fontWeight: 700, letterSpacing: 3, color: INK_DIM, textTransform: "uppercase", marginBottom: 10 }}>Dinlenme</div>
                    <div className={"gp-timer-ring" + (isRunningTimer ? " running" : "")} style={{ fontFamily: "'Fraunces',serif", fontWeight: 300, fontSize: 76, lineHeight: 1 }}>{formatDuration(dp.secondsLeft)}</div>
                    {nextEx && <div style={{ fontSize: 14, color: INK_DIM, marginTop: 22 }}>Sırada: <span style={{ color: INK }}>{nextEx.text}</span></div>}
                  </>
                ) : (
                  <>
                    <div style={{ fontSize: 12.5, fontWeight: 700, letterSpacing: 3, color: accent, textTransform: "uppercase", marginBottom: 10 }}>Hareket {dp.index + 1}</div>
                    {ex?.mediaUrl && (
                      ex.mediaType === "video" ? (
                        <video src={ex.mediaUrl} controls playsInline style={{ width: "100%", maxWidth: 260, maxHeight: 150, borderRadius: 16, marginBottom: 14, background: "#000" }} />
                      ) : (
                        <img src={ex.mediaUrl} alt="" style={{ width: "100%", maxWidth: 260, maxHeight: 150, borderRadius: 16, marginBottom: 14, objectFit: "cover" }} />
                      )
                    )}
                    <div style={{ fontFamily: "'Fraunces',serif", fontWeight: 400, fontSize: 32, lineHeight: 1.15, marginBottom: 18, maxWidth: 300 }}>{ex?.text}</div>
                    {ex?.mode === "time" ? (
                      <div className={"gp-timer-ring" + (isRunningTimer ? " running" : "")} style={{ fontFamily: "'Fraunces',serif", fontWeight: 300, fontSize: 76, lineHeight: 1 }}>{formatDuration(dp.secondsLeft)}</div>
                    ) : (
                      <div style={{ fontSize: 22, color: INK_DIM, fontWeight: 500 }}>{ex?.repsLabel}</div>
                    )}
                    {nextEx && <div style={{ fontSize: 13.5, color: INK_FAINT, marginTop: 22 }}>Sırada: {nextEx.text}</div>}
                  </>
                )}
              </div>

              {/* kontroller */}
              {dp.phase !== "done" && (
                <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14 }}>
                  {dp.phase === "exercise" && ex?.mode === "reps" ? (
                    <>
                      <button onClick={skipCurrent} style={{ padding: "14px 20px", borderRadius: 26, border: "1px solid rgba(244,242,237,0.25)", background: "transparent", color: INK_DIM, fontSize: 14, fontWeight: 600, cursor: "pointer", transition: "transform .15s" }}>Atla</button>
                      <button onClick={completeCurrentExercise} style={{ flex: 1, padding: "16px 0", borderRadius: 28, border: "none", background: accent, color: BG, fontSize: 15.5, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, transition: "transform .15s" }}>
                        <Check size={17} strokeWidth={3} /> Tamamladım
                      </button>
                    </>
                  ) : (
                    <>
                      <button onClick={skipCurrent} aria-label="Atla" style={{ width: 52, height: 52, borderRadius: 26, border: "1px solid rgba(244,242,237,0.25)", background: "transparent", color: INK_DIM, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", transition: "transform .15s" }}>
                        <SkipForward size={20} />
                      </button>
                      <button onClick={togglePause} className="gp-playpause-btn" aria-label={dp.running ? "Duraklat" : "Devam"} style={{ width: 72, height: 72, borderRadius: 36, border: "none", background: accent, color: BG, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
                        <span key={dp.running ? "pause" : "play"} className="gp-playpause-icon" style={{ display: "flex" }}>
                          {dp.running ? <Pause size={26} fill={BG} /> : <Play size={26} fill={BG} />}
                        </span>
                      </button>
                      <div style={{ width: 52 }} />
                    </>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      })()}
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<GunlukPlanlayiciReact />);

</script>
</body>
</html>
